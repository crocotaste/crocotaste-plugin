<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Sample · Design guidelines</title>
    <style>
      <!-- fonts:start -->
      <!-- fonts:end -->
      <!-- tokens:start -->
      :root {
      --color-canvas: #ffffff;
      --color-surface: #f6f7f9;
      --color-surface-raised: #ffffff;
      --color-border: #e2e5ea;
      --color-border-strong: #c3c8d1;
      --color-text: #16181d;
      --color-text-muted: #5a6270;
      --color-text-faint: #7a8290;
      --color-text-inverse: #ffffff;
      --color-primary: #2456e6;
      --color-primary-hover: #1c46c2;
      --color-primary-active: #163899;
      --color-primary-text: #ffffff;
      --color-primary-soft: #e8eefc;
      --color-accent: #e6a024;
      --color-success: #1f8a4c;
      --color-warning: #c77700;
      --color-danger: #d12a3f;
      --color-focus: var(--color-primary);
      --color-scrim: rgba(0,0,0,0.5);
      --font-display: Inter;
      --font-body: Inter;
      --font-mono: ui-monospace;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --space-16: 64px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --text-display: 48px;
      --text-display-weight: 700;
      --text-display-leading: 1.1;
      --text-display-family: display;
      --text-display-tracking: -0.02em;
      --text-title: 32px;
      --text-title-weight: 700;
      --text-title-leading: 1.2;
      --text-title-family: display;
      --text-title-tracking: -0.01em;
      --text-heading: 22px;
      --text-heading-weight: 600;
      --text-heading-leading: 1.3;
      --text-heading-family: display;
      --text-heading-tracking: 0;
      --text-body: 16px;
      --text-body-weight: 400;
      --text-body-leading: 1.5;
      --text-body-family: body;
      --text-body-tracking: 0;
      --text-small: 14px;
      --text-small-weight: 400;
      --text-small-leading: 1.45;
      --text-small-family: body;
      --text-small-tracking: 0;
      --text-caption: 12px;
      --text-caption-weight: 500;
      --text-caption-leading: 1.4;
      --text-caption-family: body;
      --text-caption-tracking: 0.02em;
      --motion-fast: 120ms;
      --motion-base: 200ms;
      --motion-slow: 320ms;
      }
      [data-theme="dark"] {
      --color-canvas: #0b0d10;
      --color-surface: #14171c;
      --color-surface-raised: #1b1f26;
      --color-border: #272c35;
      --color-border-strong: #3a414d;
      --color-text: #f2f4f7;
      --color-text-muted: #a3abb8;
      --color-text-faint: #737c8a;
      --color-text-inverse: #0b0d10;
      --color-primary: #6d8ff0;
      --color-primary-hover: #8aa5f4;
      --color-primary-active: #a6baf7;
      --color-primary-text: #0b0d10;
      --color-primary-soft: #1a2442;
      --color-accent: #f0b64a;
      --color-success: #4cc07c;
      --color-warning: #e8a23a;
      --color-danger: #f0677a;
      --color-focus: var(--color-primary);
      --color-scrim: rgba(0,0,0,0.7);
      }
      <!-- tokens:end -->
      @media (prefers-reduced-motion: reduce) {
        * { transition: none; animation: none; }
      }
    </style>
  </head>
  <body>
    <button data-theme-toggle>Theme</button>
    <nav data-sidebar>
      <a href="#foundations">Foundations</a>
      <a href="#mark">Mark</a>
      <a href="#color">Color</a>
      <a href="#typography">Typography</a>
      <a href="#spacing">Spacing</a>
      <a href="#iconography">Iconography</a>
      <a href="#components">Components</a>
      <a href="#motion">Motion</a>
      <a href="#voice">Voice</a>
      <a href="#responsive">Responsive</a>
    </nav>
    <section id="foundations" data-chapter></section>
    <section id="mark" data-chapter></section>
    <section id="color" data-chapter></section>
    <section id="typography" data-chapter></section>
    <section id="spacing" data-chapter></section>
    <section id="iconography" data-chapter></section>
    <section id="components" data-chapter>
      <div data-component="button-primary" data-tokens="backgroundColor=primary textColor=primary-text rounded=full"><span data-state="default"></span><span data-state="hover"></span><span data-state="active"></span><span data-state="focus"></span><span data-state="disabled"></span><span data-state="loading"></span></div>
      <div data-component="button-secondary"></div>
      <div data-component="button-ghost"></div>
      <div data-component="input" data-tokens="borderColor=border textColor=text rounded=md"><span data-state="default"></span><span data-state="hover"></span><span data-state="active"></span><span data-state="focus"></span><span data-state="disabled"></span><span data-state="error"></span></div>
      <div data-component="select"></div>
      <div data-component="checkbox"></div>
      <div data-component="switch"></div>
      <div data-component="card"></div>
      <div data-component="table"></div>
      <div data-component="tabs"></div>
      <div data-component="dialog"></div>
      <div data-component="toast"></div>
      <div data-component="empty-state"></div>
      <div data-component="nav"></div>
    </section>
    <section id="motion" data-chapter></section>
    <section id="voice" data-chapter></section>
    <section id="responsive" data-chapter></section>
  </body>
</html>
