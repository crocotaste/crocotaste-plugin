<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockups</title>
    <meta name="description" content="Every screen mocked up with the brand tokens." />
    <style>
    <!-- fonts:start -->
    <!-- fonts:end -->
    <!-- tokens:start -->
    :root {
    --color-canvas: #ffffff;
    --color-surface: #f6f7f9;
    --color-surface-raised: #ffffff;
    --color-border: #e2e5ea;
    --color-border-strong: #c3c8d1;
    --color-text: #16181d;
    --color-text-muted: #5a6270;
    --color-text-faint: #7a8290;
    --color-text-inverse: #ffffff;
    --color-primary: #2456e6;
    --color-primary-hover: #1c46c2;
    --color-primary-active: #163899;
    --color-primary-text: #ffffff;
    --color-primary-soft: #e8eefc;
    --color-accent: #e6a024;
    --color-success: #1f8a4c;
    --color-warning: #c77700;
    --color-danger: #d12a3f;
    --color-focus: var(--color-primary);
    --color-scrim: rgba(0,0,0,0.5);
    --font-display: Inter;
    --font-body: Inter;
    --font-mono: ui-monospace;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --space-8: 32px;
    --space-12: 48px;
    --space-16: 64px;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --text-display: 48px;
    --text-display-weight: 700;
    --text-display-leading: 1.1;
    --text-display-family: display;
    --text-display-tracking: -0.02em;
    --text-title: 32px;
    --text-title-weight: 700;
    --text-title-leading: 1.2;
    --text-title-family: display;
    --text-title-tracking: -0.01em;
    --text-heading: 22px;
    --text-heading-weight: 600;
    --text-heading-leading: 1.3;
    --text-heading-family: display;
    --text-heading-tracking: 0;
    --text-body: 16px;
    --text-body-weight: 400;
    --text-body-leading: 1.5;
    --text-body-family: body;
    --text-body-tracking: 0;
    --text-small: 14px;
    --text-small-weight: 400;
    --text-small-leading: 1.45;
    --text-small-family: body;
    --text-small-tracking: 0;
    --text-caption: 12px;
    --text-caption-weight: 500;
    --text-caption-leading: 1.4;
    --text-caption-family: body;
    --text-caption-tracking: 0.02em;
    --motion-fast: 120ms;
    --motion-base: 200ms;
    --motion-slow: 320ms;
    }
    [data-theme="dark"] {
    --color-canvas: #0b0d10;
    --color-surface: #14171c;
    --color-surface-raised: #1b1f26;
    --color-border: #272c35;
    --color-border-strong: #3a414d;
    --color-text: #f2f4f7;
    --color-text-muted: #a3abb8;
    --color-text-faint: #737c8a;
    --color-text-inverse: #0b0d10;
    --color-primary: #6d8ff0;
    --color-primary-hover: #8aa5f4;
    --color-primary-active: #a6baf7;
    --color-primary-text: #0b0d10;
    --color-primary-soft: #1a2442;
    --color-accent: #f0b64a;
    --color-success: #4cc07c;
    --color-warning: #e8a23a;
    --color-danger: #f0677a;
    --color-focus: var(--color-primary);
    --color-scrim: rgba(0,0,0,0.7);
    }
    <!-- tokens:end -->
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--color-canvas);
      color: var(--color-text);
      font-family: var(--font-body), system-ui, sans-serif;
      font-size: var(--text-body);
      line-height: var(--text-body-leading);
    }
    img, svg { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--color-primary); }
    :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    main { max-width: 960px; margin: 0 auto; padding: var(--space-16) var(--space-6); }
    h1 {
      font-family: var(--font-display), system-ui, sans-serif;
      font-size: var(--text-title);
      font-weight: var(--text-title-weight);
      line-height: var(--text-title-leading);
    }
    .lede { margin-top: var(--space-2); color: var(--color-text-muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--space-4);
      margin-top: var(--space-8);
    }
    .screen {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: var(--space-6);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      color: var(--color-text);
      text-decoration: none;
      transition: border-color var(--motion-fast);
    }
    .screen:hover { border-color: var(--color-primary); }
    .screen span { color: var(--color-text-muted); font-size: var(--text-small); }
    .empty { margin-top: var(--space-8); color: var(--color-text-muted); }
    [data-theme-toggle] {
      position: fixed;
      right: var(--space-4);
      bottom: var(--space-4);
      padding: var(--space-2) var(--space-4);
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-full);
      font-size: var(--text-small);
      cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none; animation: none; }
    }
    </style>
  </head>
  <body>
    <main>
      <h1>Mockups</h1>
      <p class="lede">Each screen below is built from the brand book's tokens.</p>
      <!-- screens -->
    </main>
    <button type="button" data-theme-toggle>Theme</button>
    <script>
      (function () {
        var root = document.documentElement;
        var saved = null;
        try { saved = localStorage.getItem("brand-theme"); } catch (e) {}
        if (saved) root.dataset.theme = saved;
        document.querySelector("[data-theme-toggle]").addEventListener("click", function () {
          var next = root.dataset.theme === "dark" ? "light" : "dark";
          root.dataset.theme = next;
          try { localStorage.setItem("brand-theme", next); } catch (e) {}
        });
      })();
    </script>
  </body>
</html>
